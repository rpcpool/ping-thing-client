[package]
name = "ping-thing-client-rust"
version = "0.4.1"
edition = "2021"

[[bin]]
name = "ping-thing-client"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.53.1", features = ["full"] }
solana-hash = "~4.5.0"
solana-keypair = "3.1.2"
solana-message = "~4.4.1"
solana-pubkey = "~4.2.0"
solana-signer = "3.0.1"
solana-transaction = "~4.1.6"
solana-transaction-status = { version = "4.2.2", features = ["agave-unstable-api"] }
solana-client = "4.2.1"
solana-sdk = "~4.0.1"
solana-compute-budget-interface = "~3.0.0"
solana-instruction = "~3.4.0"
solana-system-interface = "3.2.0"
spl-memo-interface = "2.1.0"
base64 = "0.23.1"
bincode = "1.3.3"
bs58 = "0.5.1"
dotenv = { package = "dotenvy", version = "0.15.0" }
env_logger = "0.11.11"
log = "0.4.34"
rand = "0.10.2"
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
prometheus = "0.14.0"
warp = { version = "0.4.3", features = ["server"] }
anyhow = "1.0.104"
tonic = "0.14.6"
prost = "0.14.4"
prost-types = "0.14.4"
futures = "0.3.34"
yellowstone-grpc-client = "13.5.0"
yellowstone-grpc-proto = "12.7.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }
