# .goreleaser.yaml for rpcpool/ping-thing-client
#
# This file must be committed to the root of the ping-thing-client source
# repo. GCS upload, cosigning, and GitHub Release publishing are injected via
# ci/goreleaser-patch.yaml in Binaries-ci at build time.
#
# yaml-language-server: $schema=https://goreleaser.com/static/schema.json

version: 2

builds:
    - id: ping-thing-client
      builder: rust
      command: build
      binary: ping-thing-client
      targets:
          - x86_64-unknown-linux-gnu
      flags:
          - --release
          - --bin=ping-thing-client

archives:
    - id: ping-thing-client
      name_template: ping-thing-client-linux-amd64
      formats: [binary]
      ids:
          - ping-thing-client

release:
    github:
        owner: rpcpool
        name: ping-thing-client
    draft: true
    header: |
        rust {{ .Env.RUST_VERSION }}

changelog:
    sort: asc
    use: github
